<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eae8df">
  <meta name="description" content="风景来信：按今天的天气，给你一处可以慢下来的地方。">
  <title>风景来信 · 今天去看看远处</title>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link rel="stylesheet" href="../assets/field-daily-v26.css">
  <script defer src="../assets/field-daily-v25.js"></script>
</head>
<body class="scenic-site" data-scene-page="starlight">
  <div id="app" class="scenic-app">
    <header class="masthead">
      <a class="wordmark" href="../index.html"><span class="wordmark-mark">风</span><span>风景来信<small>把今天和远处寄给你</small></span></a>
      <time class="today-date" id="today-date"></time>
      <div class="place-tools">
        <div class="weather-summary" id="weather-summary" aria-live="polite"><span class="weather-glyph">◌</span><span><b id="weather-place">还没选城市</b><small id="weather-line">选一座城市，看看今天的天色</small></span></div>
        <form class="city-search" id="city-form"><label class="sr-only" for="city-input">搜索城市</label><input id="city-input" name="city" autocomplete="off" placeholder="输入城市" maxlength="40"><button type="submit" aria-label="搜索城市">↵</button></form>
        <button class="locate-button" id="locate-button" type="button" aria-label="使用当前位置查询城市天气">⌖ <span>定位</span></button>
      </div>
    </header>
    <main id="experience" aria-live="polite"><div class="loading-note">正在为今天挑一处风景……</div></main>
    <footer class="site-footer"><a href="../index.html">风景来信</a><span>天气数据 <a href="https://open-meteo.com/" target="_blank" rel="noreferrer">Open-Meteo</a> · 风景图片 <a href="https://unsplash.com/" target="_blank" rel="noreferrer">Unsplash</a></span><span>定位仅在点击后使用，用于识别城市并查询天气。</span></footer>
  </div>
  <noscript><p class="noscript">请启用 JavaScript 来查看今日风景与天气。</p></noscript>
</body>
</html>
